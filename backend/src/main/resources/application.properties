server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/campus_lost_and_found?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Inter-Service Communication (Claim Review Microservice)
app.claim-service.base-url=${CLAIM_REVIEW_URL:http://localhost:8081}
app.claim-service.api-key=${CLAIM_SERVICE_API_KEY}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Administrative Bootstrap Credentials
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@srmist.edu.in}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap.admin.name=SRM Lost & Found Administrator
app.bootstrap.demo-user-password=${DEMO_USER_PASSWORD}

# Logging
logging.level.edu.srmist.lostandfound=INFO
