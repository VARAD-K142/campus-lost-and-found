server.port=${PORT:8081}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/campus_claim_review?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Inter-Service Security
service.api-key=${CLAIM_SERVICE_API_KEY}

# Logging
logging.level.edu.srmist.claimreview=INFO
